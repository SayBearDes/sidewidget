name: collect
on:
  # Плановые запуски GitHub ненадёжны: их задерживают на часы и часть пропускает совсем
  # (из трёх слотов за двое суток сработал один, с опозданием в 5 часов). Поэтому запускаем
  # часто, раз в 3 часа, и не на ровный час: хватит любого одного сработавшего слота.
  schedule: [{ cron: "23 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Previous data.json (подставляется, если источник упал)
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/data.json" -o prev.json || true
      - run: npm install --no-audit --no-fund
        working-directory: collector
      - run: node index.mjs ../out/data.json
        working-directory: collector
        env:
          PH_CLIENT_ID: ${{ secrets.PH_CLIENT_ID }}
          PH_CLIENT_SECRET: ${{ secrets.PH_CLIENT_SECRET }}
          PREV_JSON: ${{ github.workspace }}/prev.json
      - name: Publish to branch "data"
        run: |
          cd out
          git init -q -b data
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data.json
          git commit -qm "data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
